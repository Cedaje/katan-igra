<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Ostrvo Trgovaca</title>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f3ead6; color: #3b2a17; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .note { color: #7a6448; margin: 0 0 18px; font-size: 13px; }
  .card { background: #fffaf0; border: 1px solid #d9c6a2; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  input { font: inherit; padding: 8px 10px; border: 1px solid #c9b38c; border-radius: 8px; background: #fff; min-width: 0; }
  button { font: inherit; padding: 8px 12px; border: 0; border-radius: 8px; background: #2f7d5b; color: #fff; cursor: pointer; }
  button.gray { background: #8a7656; } button.red { background: #b0473a; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eadcc0; vertical-align: middle; }
  th { font-size: 12px; color: #7a6448; font-weight: 600; }
  code { font-size: 15px; font-weight: 700; letter-spacing: 1px; background: #f3ead6; padding: 2px 6px; border-radius: 6px; }
  .tag { font-size: 12px; background: #f7d46b; padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; } .acts button { padding: 5px 8px; font-size: 12px; }
  #msg { min-height: 20px; font-size: 14px; margin: 6px 0 0; } #msg.err { color: #b0473a; }
  .hidden { display: none; }
  @media (max-width: 600px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <h1>🔧 Admin – profili igrača</h1>
  <p class="note">Samo za vlasnika igre. Ovde nalaziš kod profila igrača koji je izgubio kod, praviš mu novi kod ili otključavaš sve ukrase.</p>

  <div class="card" id="login">
    <div class="row"><input id="pass" type="password" placeholder="Admin lozinka" autocomplete="current-password"><button id="go">Uđi</button></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="row"><input id="q" placeholder="Ime igrača ili deo koda (prazno = poslednji aktivni)"><button id="search">Traži</button></div>
    </div>
    <div class="card"><table><thead><tr><th>Ime</th><th>Kod profila</th><th class="hide-sm">Partije / pobede</th><th class="hide-sm">Poslednji put</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
  <p id="msg"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let PASS = sessionStorage.getItem('ot_admin') || '';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function msg(t, err) { $('msg').textContent = t || ''; $('msg').className = err ? 'err' : ''; }
  async function api(body) {
    const r = await fetch('/admin/api', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin': PASS }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({ error: 'Greška na serveru.' }));
    if (!r.ok) throw Object.assign(new Error(j.error || 'Greška'), { status: r.status });
    return j;
  }
  const when = (t) => t ? new Date(t).toLocaleString('sr-RS', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–';
  function rowHTML(r) {
    return `<tr data-code="${r.code}"><td><b>${esc(r.name)}</b>${r.all ? '<span class="tag">sve otključano</span>' : ''}</td><td><code>${r.code}</code></td>
      <td class="hide-sm">${r.games} / ${r.wins}</td><td class="hide-sm">${when(r.updated)}</td>
      <td><div class="acts"><button class="gray" data-copy>Kopiraj kod</button>
      ${r.all ? '<button class="gray" data-what="lock">Vrati zaključano</button>' : '<button data-what="unlockAll">Otključaj sve</button>'}
      <button class="red" data-what="newCode" title="Stari kod prestaje da radi">Novi kod</button></div></td></tr>`;
  }
  async function search() {
    try {
      const { rows } = await api({ op: 'search', q: $('q').value });
      $('rows').innerHTML = rows.length ? rows.map(rowHTML).join('') : '<tr><td colspan="5">Nema profila koji odgovaraju.</td></tr>';
      msg(rows.length ? `Nađeno: ${rows.length}` : '');
      return true;
    } catch (e) {
      if (e.status === 401 || e.status === 403 || e.status === 429) { $('panel').classList.add('hidden'); $('login').classList.remove('hidden'); sessionStorage.removeItem('ot_admin'); }
      msg(e.message, true); return false;
    }
  }
  async function login() {
    PASS = $('pass').value || PASS;
    if (await search()) { sessionStorage.setItem('ot_admin', PASS); $('login').classList.add('hidden'); $('panel').classList.remove('hidden'); }
  }
  $('go').onclick = login;
  $('pass').onkeydown = (e) => { if (e.key === 'Enter') login(); };
  $('search').onclick = search;
  $('q').onkeydown = (e) => { if (e.key === 'Enter') search(); };
  $('rows').onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const tr = b.closest('tr'), code = tr.dataset.code;
    if (b.hasAttribute('data-copy')) { navigator.clipboard?.writeText(code); msg('Kod ' + code + ' je kopiran.'); return; }
    const what = b.dataset.what;
    if (what === 'newCode' && b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Sigurno? Klikni opet'; return; }
    try {
      const { row } = await api({ op: 'update', code, what });
      tr.outerHTML = rowHTML(row);
      msg({ unlockAll: 'Otključano sve za ' + row.name + '. Neka osveži stranicu igre.', lock: 'Ukrasi su ponovo zaključani za ' + row.name + '.', newCode: 'Novi kod za ' + row.name + ': ' + row.code + ' (stari više ne radi).' }[what]);
    } catch (err) { msg(err.message, true); }
  };
  if (PASS) login();
</script>
</body>
</html>
